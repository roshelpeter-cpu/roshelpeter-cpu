name: Update GitHub Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: write

concurrency:
  group: update-github-analytics
  cancel-in-progress: false

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh contribution streak
        continue-on-error: true
        run: node scripts/generate-github-analytics.mjs --streak

      - name: Refresh statistics and language distribution
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "METRICS_TOKEN is not configured. Existing statistics were left unchanged."
            exit 0
          fi
          node scripts/generate-github-analytics.mjs

      - name: Commit analytics when they change
        run: |
          files=()
          for file in assets/analytics/stats.svg assets/analytics/languages.svg assets/analytics/streak-light.svg assets/analytics/streak-dark.svg; do
            if [ -f "$file" ]; then
              files+=("$file")
            fi
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "No generated analytics to commit."
            exit 0
          fi
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "Analytics images are unchanged. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GitHub analytics snapshot"
          git push origin HEAD:main
