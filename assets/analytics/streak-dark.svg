<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200" role="img" aria-labelledby="streakTitle streakDesc" data-analytics-state="live">
  <title id="streakTitle">Contribution streak</title>
  <desc id="streakDesc">Current streak 0 days. Longest streak 3 days. Calculated from GitHub contribution dates 2025-08-19 through 2026-11-23.</desc>
  <rect width="340" height="200" fill="transparent"/>
  <text x="30" y="40" fill="#e6edf3" font-size="22" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif">Contribution streak</text>
  <text x="30" y="98" fill="#c9d1d9" font-size="14" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif">Current streak</text>
  <text data-streak="current" x="30" y="124" fill="#e6edf3" font-size="18" font-weight="700" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif">0 days</text>
  <text x="30" y="156" fill="#c9d1d9" font-size="14" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif">Longest streak</text>
  <text data-streak="longest" x="30" y="182" fill="#e6edf3" font-size="18" font-weight="700" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif">3 days</text>
  <circle cx="272" cy="122" r="44" fill="none" stroke="#30363d" stroke-width="9"/>
  
  <text data-streak="ring" x="272" y="130" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="700" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif">0</text>
</svg>
